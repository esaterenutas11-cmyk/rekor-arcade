<style>

.desc{margin:0;font-weight:800;font-size:calc(var(--u)*14);line-height:1.35;color:#fff;text-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(0,0,0,.7);max-width:28ch}

.pn h2{margin:0;font-family:var(--disp);font-weight:400;font-size:calc(var(--u)*40);line-height:1;color:var(--lc,#fff);--sw:calc(var(--u)*7);--sc:var(--ls,#1a1a5a);--ts:0 calc(var(--u)*4) 0 rgba(0,0,0,.35);letter-spacing:.02em}
.lbl{font-family:var(--disp);font-size:calc(var(--u)*13);letter-spacing:.14em;color:#c3ccff;margin-top:calc(var(--u)*2)}
.big{font-family:var(--disp);font-size:calc(var(--u)*44);line-height:1;font-variant-numeric:tabular-nums;margin-top:calc(var(--u)*-8)}

.rec{font-family:var(--disp);font-size:calc(var(--u)*16);background:linear-gradient(#ffe066,#ffb703);color:#5a2a00;border-radius:calc(var(--u)*10);padding:calc(var(--u)*4) calc(var(--u)*12);letter-spacing:.06em;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.btn{font-family:var(--disp);font-size:calc(var(--u)*22);letter-spacing:.05em;color:#fff;border:0;cursor:pointer;width:calc(var(--u)*210);padding:calc(var(--u)*10) 0 calc(var(--u)*9);border-radius:calc(var(--u)*14);background:linear-gradient(#6ee67a,#22a83a);box-shadow:0 calc(var(--u)*5) 0 #136b25,inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.45);text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(calc(var(--u)*3));box-shadow:0 calc(var(--u)*2) 0 #136b25}
.btn.blue{background:linear-gradient(#4fc3ff,#1f7ae0);box-shadow:0 calc(var(--u)*5) 0 #0f4a96,inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.45)}
.btn.red{background:linear-gradient(#ff7a8a,#e0314a);box-shadow:0 calc(var(--u)*5) 0 #8a1a2a,inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.45)}
.btn.purple{background:linear-gradient(#b48cff,#7a3fe0);box-shadow:0 calc(var(--u)*5) 0 #45208a,inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.45)}
.btn:focus-visible{outline:calc(var(--u)*3) solid var(--gold);outline-offset:calc(var(--u)*3)}
.hint{font-size:calc(var(--u)*12);color:var(--mut);font-weight:700;margin:0}
.logo,.pn h2{position:relative}
.lg,.logo,.pn h2{z-index:0}
.lg::before,.logo::before,.pn h2::before{content:attr(data-t);position:absolute;left:0;top:0;right:0;z-index:-1;color:var(--sc);-webkit-text-stroke:var(--sw) var(--sc);text-shadow:var(--ts);pointer-events:none}

<script>window.ARC_MODE='game'</script>
<script>
'use strict';
const W=360,H=640;
const R=(a,b)=>a+Math.random()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1)), CL=(v,a,b)=>v<a?a:v>b?b:v, pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;

/* ---------- drawing helpers ---------- */
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function box(c,x,y,w,h,r,col,hl=.24){rr(c,x,y,w,h,r);c.fillStyle=col;c.fill();c.save();c.clip();c.fillStyle='rgba(255,255,255,'+hl+')';c.fillRect(x,y,w,h*.42);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(x,y+h*.78,w,h*.22);c.restore()}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=p<0?0:255,t=Math.abs(p);r=Math.round(r+(f-r)*t);g=Math.round(g+(f-g)*t);b=Math.round(b+(f-b)*t);return 'rgb('+r+','+g+','+b+')'}
function orb(c,x,y,r,col){const gr=c.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);gr.addColorStop(0,shade(col,.6));gr.addColorStop(.35,col);gr.addColorStop(1,shade(col,-.45));c.fillStyle=gr;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
function vg(c,y0,y1,...cols){const g=c.createLinearGradient(0,y0,0,y1);cols.forEach((k,i)=>g.addColorStop(i/(cols.length-1),k));return g}
function emo(c,ch,x,y,s){c.font=s+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(ch,x,y)}
function shadow(c,x,y,rx,ry,a=.22){c.fillStyle='rgba(0,0,0,'+a+')';c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill()}
function coin(c,x,y,r=10){orb(c,x,y,r,'#ffc928');c.strokeStyle='#c98a00';c.lineWidth=2;c.beginPath();c.arc(x,y,r*.58,0,TAU);c.stroke()}
function star5(c,x,y,r,col){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath();c.fillStyle=col;c.fill()}
function segDist(ax,ay,bx,by,px,py){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;const t=l?CL(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function circRect(cx,cy,r,x,y,w,h){return Math.hypot(cx-CL(cx,x,x+w),cy-CL(cy,y,y+h))<r}
function hearts(n){return '♥'.repeat(Math.max(0,n))}
function clouds(c,x,y,s,a=.9){c.fillStyle='rgba(255,255,255,'+a+')';c.beginPath();c.arc(x,y,18*s,0,TAU);c.arc(x+20*s,y-8*s,22*s,0,TAU);c.arc(x+44*s,y,18*s,0,TAU);c.rect(x,y,44*s,16*s);c.fill()}

const CARC=['#e63946','#ffb703','#3a86ff','#8338ec','#06d6a0','#fb5607'];
const GAMES=[];const def=o=>GAMES.push(o);

/* =========================================================
   8. FISH EAT FISH
   ========================================================= */
const FCOL=['#ff6b6b','#4dabf7','#69db7c','#ffd43b','#da77f2','#ff922b','#38d9a9','#f783ac'];
function fish(c,x,y,r,dir,col,t,me){c.save();c.translate(x,y);c.scale(dir,1);const w=Math.sin(t*8)*.25;
  if(me){c.shadowColor='#fff';c.shadowBlur=10}
  c.fillStyle=shade(col,-.2);c.beginPath();c.moveTo(-r*1,0);c.lineTo(-r*1.9,-r*.8+w*r);c.lineTo(-r*1.65,0);c.lineTo(-r*1.9,r*.8+w*r);c.closePath();c.fill();
  const gr=c.createLinearGradient(0,-r,0,r);gr.addColorStop(0,shade(col,.35));gr.addColorStop(1,shade(col,-.3));c.fillStyle=gr;c.beginPath();c.ellipse(0,0,r*1.3,r*.9,0,0,TAU);c.fill();c.shadowBlur=0;
  c.fillStyle=shade(col,-.12);c.beginPath();c.moveTo(-r*.5,-r*.78);c.quadraticCurveTo(0,-r*1.35,r*.5,-r*.72);c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,.25)';c.beginPath();c.ellipse(r*.1,-r*.35,r*.7,r*.22,0,0,TAU);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(r*.62,-r*.2,r*.28,0,TAU);c.fill();c.fillStyle='#111';c.beginPath();c.arc(r*.7,-r*.2,r*.14,0,TAU);c.fill();c.restore()}
def({id:'fish',name:'Fish Eat Fish',desc:'Küçük balıkla başla, kendinden küçükleri ye, büyü ve deniz kralı ol!',ctrl:'Sürükle ya da ok tuşları',th:['#2bb5f0','#0a4e9a','#ffb627','#06264d'],steer:true,
init(g){const s=g.s={p:{x:180,y:360,r:14,dir:1},n:[],next:.2,lvl:1,bub:[],sw:[]};for(let i=0;i<20;i++)s.bub.push({x:R(0,W),y:R(0,H),r:R(2,5),v:R(20,50)});for(let i=0;i<7;i++)s.sw.push({x:R(10,W-10),h:R(50,120),p:R(0,6)});
  if(g.demo)for(let i=0;i<6;i++)s.n.push({x:R(30,330),y:R(120,560),r:R(7,30),dir:pick([-1,1]),v:0,col:pick(FCOL),ph:0})},
update(g,dt){const s=g.s,p=s.p;let tx=0,ty=0;
  if(g.ptr.down){const dx=g.ptr.x-p.x,dy=g.ptr.y-p.y,d=Math.hypot(dx,dy);if(d>4){const sp=Math.min(d*6,230);tx=dx/d*sp;ty=dy/d*sp}}else{tx=g.ax*220;ty=g.ay*220}
  p.x=CL(p.x+tx*dt,20,W-20);p.y=CL(p.y+ty*dt,80,H-30);if(Math.abs(tx)>5)p.dir=Math.sign(tx);
  s.next-=dt;if(s.next<=0){s.next=R(.45,.9);const dir=Math.random()<.5?1:-1,big=Math.random()>.58,r=p.r*(big?R(1.15,2.2):R(.35,.85));s.n.push({x:dir>0?-60:W+60,y:R(100,H-50),r,dir,v:R(40,110)*(big?.8:1.1)*(1+s.lvl*.08),col:pick(FCOL),ph:R(0,6)})}
  for(const f of s.n){f.x+=f.dir*f.v*dt;f.ph+=dt;f.y+=Math.sin(f.ph*2)*10*dt}s.n=s.n.filter(f=>f.x>-120&&f.x<W+120);
  for(let i=s.n.length-1;i>=0;i--){const f=s.n[i];if(Math.hypot(f.x-p.x,f.y-p.y)<p.r*1.05+f.r*.7){if(f.r<p.r*.92){s.n.splice(i,1);const pts=Math.max(1,Math.round(f.r/3));g.add(pts);p.r+=f.r*.07;g.sfx('point');g.burst(f.x,f.y,'#bfe9ff',8,100);g.pop(f.x,f.y-10,'+'+pts)}else if(f.r>p.r*1.05){g.sfx('hit');g.burst(p.x,p.y,'#ff8c1a',16,160);g.end();return}}}
  if(p.r>34){p.r*=.55;for(const f of s.n)f.r*=.55;s.lvl++;g.pop(180,300,'SEVİYE '+s.lvl+'!','#ffd23f');g.sfx('coin')}
  for(const b of s.bub){b.y-=b.v*dt;if(b.y<60){b.y=H;b.x=R(0,W)}}g.info='SEVİYE '+s.lvl},
draw(g,c){const s=g.s,t=g.t;c.fillStyle=vg(c,0,H,'#5fd0ff','#1677c4','#0a3f78');c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<4;i++){c.beginPath();c.moveTo(40+i*90,0);c.lineTo(80+i*90,0);c.lineTo(20+i*90+Math.sin(t+i)*10,H);c.lineTo(-30+i*90,H);c.fill()}
  c.fillStyle='#e9cf8f';c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=30)c.lineTo(x,610+Math.sin(x/40)*8);c.lineTo(W,H);c.fill();
  for(const w of s.sw){c.strokeStyle='#2f9e5b';c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(w.x,622);for(let k=1;k<=6;k++)c.lineTo(w.x+Math.sin(t*1.5+w.p+k*.7)*8*k/6,622-w.h*k/6);c.stroke()}
  for(const b of s.bub){c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=1.5;c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.stroke()}
  for(const f of s.n){fish(c,f.x,f.y,f.r,f.dir,f.col,t+f.ph);if(f.r>s.p.r*1.05){c.fillStyle='#ff3b3b';c.beginPath();c.arc(f.x+f.dir*f.r*.95,f.y-f.r*.95,3,0,TAU);c.fill()}}
  fish(c,s.p.x,s.p.y,s.p.r,s.p.dir,'#ff8c1a',t,true)}
});

/* =========================================================
   SHELL
   ========================================================= */
const $=q=>document.querySelector(q);
const hub=$('#hub'),play=$('#play'),stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d'),ov=$('#ov'),scEl=$('#sc'),infoEl=$('#info'),grid=$('#grid');
const MODE=window.ARC_MODE||'inline';
let cur=null,G=null,phase='hub',SC=1,DPR=1,sound=true,lastT=0,rstArm=false;
try{sound=localStorage.getItem('arc_snd')!=='0'}catch(e){}
function getHS(id){try{return +localStorage.getItem('arc_hs_'+id)||0}catch(e){return 0}}
function setHS(id,v){try{localStorage.setItem('arc_hs_'+id,v)}catch(e){}}

let AC=null;
function tone(f,d,type='square',v=.06,slide=0){if(!sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SFX={point:()=>tone(660,.08,'square',.04,220),coin:()=>{tone(988,.06,'square',.04);setTimeout(()=>tone(1318,.1,'square',.04),60)},jump:()=>tone(320,.12,'triangle',.08,320),hit:()=>tone(170,.25,'sawtooth',.07,-110),over:()=>{tone(420,.15,'triangle',.08,-150);setTimeout(()=>tone(260,.32,'triangle',.08,-120),150)},click:()=>tone(540,.05,'triangle',.05),slice:()=>tone(900,.07,'sawtooth',.03,-500),flip:()=>tone(440,.07,'sine',.07,300),rec:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.04),i*90))}};
const sfx=n=>SFX[n]&&SFX[n]();
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const b=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=b;src.connect(AC.destination);src.start(0)}catch(e){}}
['touchend','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{once:true,passive:true}));
document.addEventListener('touchmove',e=>{if(phase!=='hub')e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>{if(phase!=='hub')e.preventDefault()});

function mkG(demo){return{t:0,score:0,info:'',demo,dead:false,ptr:{x:W/2,y:H/2,down:false},ax:0,ay:0,parts:[],pops:[],shk:0,s:null,
  add(n){this.score+=n},end(){if(this.dead)return;this.dead=true;if(!this.demo)setTimeout(gameOver,500)},
  sfx(n){if(!this.demo)sfx(n)},shake(t=.3){if(!this.demo)this.shk=t},
  burst(x,y,col,n=12,sp=160){if(this.demo)return;for(let i=0;i<n;i++){const a=R(0,TAU),v=R(.3,1)*sp,l=R(.35,.8);this.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,life:l,max:l,col,r:R(2,5)})}},
  pop(x,y,txt,col='#fff'){if(!this.demo)this.pops.push({x,y,txt,col,life:.9})}}}
function stepFx(g,dt){for(const p of g.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt}g.parts=g.parts.filter(p=>p.life>0);for(const p of g.pops){p.y-=46*dt;p.life-=dt}g.pops=g.pops.filter(p=>p.life>0);g.shk=Math.max(0,g.shk-dt)}
function drawFx(g,c){for(const p of g.parts){c.globalAlpha=CL(p.life/p.max,0,1);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill()}c.globalAlpha=1;
  c.font='24px "Lilita One","Arial Black",sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';for(const p of g.pops){c.globalAlpha=CL(p.life*2,0,1);c.lineWidth=6;c.strokeStyle='rgba(10,14,40,.85)';c.strokeText(p.txt,p.x,p.y);c.fillStyle=p.col;c.fillText(p.txt,p.x,p.y)}c.globalAlpha=1}

function render(){const c=ctx;c.setTransform(SC*DPR,0,0,SC*DPR,0,0);c.save();if(G.shk>0)c.translate(R(-5,5),R(-5,5));
  try{cur.draw(G,c)}catch(e){console.error(e)}drawFx(G,c);c.restore();
  const sv=String(G.score);if(scEl.textContent!==sv)scEl.textContent=sv;if(infoEl.textContent!==G.info)infoEl.textContent=G.info}
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(1/30,Math.max(0,(ts-lastT)/1000));lastT=ts;if(phase==='hub'||!cur)return;
  if(phase==='play'){G.t+=dt;if(!G.dead){try{cur.update(G,dt)}catch(e){console.error(e)}}stepFx(G,dt)}render()}
requestAnimationFrame(frame);

function fit(){if(play.hidden)return;const cs=getComputedStyle(play),w=play.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=play.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  SC=Math.min(w/W,h/H);DPR=Math.min(2,window.devicePixelRatio||1);stage.style.width=W*SC+'px';stage.style.height=H*SC+'px';stage.style.setProperty('--u',SC+'px');cv.width=Math.round(W*SC*DPR);cv.height=Math.round(H*SC*DPR);if(cur&&G)render()}
window.addEventListener('resize',fit);

const th=()=>cur.th;
function styleVars(){const[a,b,lc,ls]=th();return '--lc:'+lc+';--ls:'+ls}
function showMenu(){phase='menu';ov.hidden=false;ov.className='clear';const[,,lc,ls]=th();
  ov.innerHTML='<div class="pn menu" style="'+styleVars()+'"><div class="logo" data-t="'+cur.name+'">'+cur.name+'</div><p class="desc">'+cur.desc+'</p><div class="chips"><span>'+cur.ctrl+'</span><span>Rekor: <b>'+getHS(cur.id)+'</b></span></div><button class="btn" data-a="play">PLAY</button><button class="btn blue" data-a="set">SETTINGS</button><button class="btn red" data-a="quit">QUIT</button></div>';
  ov.querySelector('[data-a=play]').focus({preventScroll:true})}
function showSet(){phase='menu';rstArm=false;ov.className='';ov.innerHTML='<div class="pn" style="'+styleVars()+'"><h2 data-t="SETTINGS">SETTINGS</h2><button class="btn blue" data-a="snd">SES: '+(sound?'AÇIK':'KAPALI')+'</button><button class="btn purple" data-a="rst">REKORU SIFIRLA</button><p class="hint">Bu oyunun rekoru: '+getHS(cur.id)+'</p><button class="btn" data-a="back">GERİ</button></div>'}
function showPause(){phase='pause';ov.hidden=false;ov.className='';ov.innerHTML='<div class="pn" style="'+styleVars()+'"><h2 data-t="PAUSED">PAUSED</h2><button class="btn" data-a="resume">RESUME</button><button class="btn blue" data-a="restart">RESTART</button><button class="btn purple" data-a="main">MAIN MENU</button></div>';ov.querySelector('[data-a=resume]').focus({preventScroll:true})}
function gameOver(){if(phase!=='play'||!G.dead)return;phase='over';const hs=getHS(cur.id),rec=G.score>hs&&G.score>0;if(rec)setHS(cur.id,G.score);sfx(rec?'rec':'over');ov.hidden=false;ov.className='';
  ov.innerHTML='<div class="pn" style="'+styleVars()+'"><h2 data-t="GAME OVER">GAME OVER</h2>'+(rec?'<div class="rec">YENİ REKOR!</div>':'')+'<div class="lbl">SCORE</div><div class="big">'+G.score+'</div><div class="lbl">HIGH SCORE</div><div class="mid">'+Math.max(hs,G.score)+'</div><button class="btn" data-a="restart">RETRY</button><button class="btn blue" data-a="main">MENU</button></div>';ov.querySelector('[data-a=restart]').focus({preventScroll:true})}
function start(){G=mkG(false);cur.init(G);phase='play';ov.hidden=true;ov.innerHTML='';sfx('click')}
function toMenu(){G=mkG(false);cur.init(G);showMenu()}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;sfx('click');
  if(a==='play'||a==='restart')start();else if(a==='set')showSet();else if(a==='quit')closeGame();else if(a==='back')showMenu();
  else if(a==='snd'){sound=!sound;try{localStorage.setItem('arc_snd',sound?'1':'0')}catch(e){}b.textContent='SES: '+(sound?'AÇIK':'KAPALI')}
  else if(a==='rst'){if(!rstArm){rstArm=true;b.textContent='EMİN MİSİN? TEKRAR BAS';return}setHS(cur.id,0);rstArm=false;showSet()}
  else if(a==='resume'){phase='play';ov.hidden=true}else if(a==='main')toMenu()});
$('#pz').addEventListener('click',()=>{if(phase==='play')showPause();else if(phase==='pause'){phase='play';ov.hidden=true}});

function openGame(i){cur=GAMES[i];hub.hidden=true;play.hidden=false;document.body.classList.add('playing');play.style.setProperty('--pa',cur.th[1]);fit();toMenu();render()}
function closeGame(){if(MODE==='game'){location.href='../index.html';return}play.hidden=true;hub.hidden=false;phase='hub';cur=null;document.body.classList.remove('playing');refreshHub()}

function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointerdown',e=>{if(phase!=='play')return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pt(e);G.ptr.x=x;G.ptr.y=y;G.ptr.down=true;if(!G.dead&&cur.down)cur.down(G,x,y)});
cv.addEventListener('pointermove',e=>{if(phase!=='play')return;const[x,y]=pt(e);G.ptr.x=x;G.ptr.y=y;if(!G.dead&&cur.move)cur.move(G,x,y)});
const pup=e=>{if(phase!=='play'||!G.ptr.down)return;const[x,y]=pt(e);G.ptr.down=false;if(!G.dead&&cur.up)cur.up(G,x,y)};
cv.addEventListener('pointerup',pup);cv.addEventListener('pointercancel',pup);

const held={};
function keyPos(k){if(k===' '||k==='ArrowUp'||k==='Enter'||k==='w'||k==='ArrowDown')return[W/2,H*.6];if(k==='ArrowLeft'||k==='a')return[40,H*.6];if(k==='ArrowRight'||k==='d')return[W-40,H*.6];return null}
window.addEventListener('keydown',e=>{if(!cur)return;const k=e.key;
  if(k==='Escape'||k==='p'||k==='P'){if(phase==='play')showPause();else if(phase==='pause'){phase='play';ov.hidden=true}e.preventDefault();return}
  if(phase!=='play'||G.dead)return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  if(k==='ArrowLeft'||k==='a')G.ax=-1;if(k==='ArrowRight'||k==='d')G.ax=1;if(k==='ArrowUp'||k==='w')G.ay=-1;if(k==='ArrowDown'||k==='s')G.ay=1;
  if(e.repeat)return;if(cur.key){cur.key(G,k);return}if(cur.steer)return;const p=keyPos(k);if(p&&cur.down){held[k]=p;cur.down(G,p[0],p[1])}});
window.addEventListener('keyup',e=>{if(!cur||!G)return;const k=e.key;if((k==='ArrowLeft'||k==='a')&&G.ax<0)G.ax=0;if((k==='ArrowRight'||k==='d')&&G.ax>0)G.ax=0;if((k==='ArrowUp'||k==='w')&&G.ay<0)G.ay=0;if((k==='ArrowDown'||k==='s')&&G.ay>0)G.ay=0;
  if(held[k]){const p=held[k];delete held[k];if(phase==='play'&&!G.dead&&cur.up)cur.up(G,p[0],p[1])}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='play')showPause()});

/* ---------- hub ---------- */
function refreshHub(){if(!grid)return;let tot=0;GAMES.forEach((gm,i)=>{const v=getHS(gm.id);tot+=v;const el=document.getElementById('hs-'+gm.id);if(el)el.textContent=v});const te=$('#tot');if(te)te.textContent=tot}
if(grid)GAMES.forEach((gm,i)=>{const[a,b,lc,ls]=gm.th,el=document.createElement(MODE==='hub'?'a':'button');if(MODE==='hub')el.href='games/'+gm.id+'.html';el.className='card';el.style.cssText='--a:'+a+';--b:'+b+';--lc:'+lc+';--ls:'+ls;el.setAttribute('aria-label',gm.name+' oyununu aç');
  el.innerHTML='<div class="ch"><h3>'+(i+1)+'. '+gm.name+'</h3><p>'+gm.desc+'</p></div><div class="th"><img alt="" id="im-'+gm.id+'"><span class="no">'+(i+1)+'</span><span class="best">REKOR <b id="hs-'+gm.id+'">0</b></span><div class="lg" data-t="'+gm.name+'">'+gm.name+'</div></div>';
  if(MODE!=='hub')el.addEventListener('click',()=>openGame(i));grid.appendChild(el)});
refreshHub();
function thumb(gm){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),g=mkG(true);try{gm.init(g);for(let i=0;i<70;i++){g.t+=1/60;if(!g.dead)gm.update(g,1/60)}gm.draw(g,x)}catch(e){console.error(gm.id,e)}return c.toDataURL('image/jpeg',.82)}
function thumbs(){GAMES.forEach((gm,i)=>setTimeout(()=>{const im=document.getElementById('im-'+gm.id);if(im)im.src=thumb(gm)},40+i*25))}
if(grid)(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(thumbs);
if(MODE==='game')openGame(0);
</script>
</body></html>
