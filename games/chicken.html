<style>html,body{margin:0;height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: arcade lobby grid of game cabinets; each game opens in a portrait 9:16 stage with menu / pause / game-over overlays */
:root{
  --ink:#0a1033; --deep:#060a24; --panel:#14215f; --panel2:#0c1645;

  --disp:'Lilita One','Arial Black',Impact,sans-serif;

}

body.playing{overflow:hidden}
#hub{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;max-width:1240px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:24px}
.brand{font-family:var(--disp);font-size:clamp(40px,8vw,72px);line-height:.9;color:var(--gold);text-shadow:3px 3px 0 #3b1a7a,-3px 3px 0 #3b1a7a,3px -3px 0 #3b1a7a,-3px -3px 0 #3b1a7a,4px 0 0 #3b1a7a,-4px 0 0 #3b1a7a,0 4px 0 #3b1a7a,0 -4px 0 #3b1a7a,0 9px 0 rgba(0,0,0,.35);transform:rotate(-2deg);transform-origin:left bottom;letter-spacing:.01em;text-wrap:balance;margin:0}
.brand span{color:#5fe3ff}
.sub{color:var(--mut);font-weight:800;margin:10px 0 0;max-width:46ch}
.tot{font-family:var(--disp);font-size:18px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 14px;letter-spacing:.04em}
.tot b{color:var(--gold);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.35);transition:transform .15s ease;min-width:0}

.ch p{margin:0;font-size:12.5px;line-height:1.35;color:#dfe5ff;font-weight:600}
.th{position:relative;min-height:0;flex:none;aspect-ratio:9/13;max-width:100%;overflow:hidden;background:rgba(0,0,0,.2)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;display:block}
.th .lg{position:absolute;left:10px;bottom:10px;right:10px;font-family:var(--disp);font-size:clamp(22px,6vw,30px);line-height:.9;color:var(--lc);--sw:7px;--sc:var(--ls);--ts:0 4px 0 rgba(0,0,0,.35);text-transform:uppercase;transform:rotate(-3deg);transform-origin:left bottom}
.th .best{position:absolute;top:10px;right:10px;background:rgba(6,10,36,.8);border-radius:10px;padding:4px 9px;font-family:var(--disp);font-size:13px;letter-spacing:.06em;color:#cfd7ff}
.th .best b{color:var(--gold);font-weight:400;font-variant-numeric:tabular-nums}
.th .no{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:10px;background:rgba(6,10,36,.8);display:grid;place-items:center;font-family:var(--disp);font-size:16px}
.foot{color:var(--mut);font-size:13px;margin-top:28px;font-weight:600}

#play{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(800px 600px at 50% 0%,var(--pa,#22307a),var(--deep));padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage{position:relative;overflow:hidden;--u:1px;border-radius:calc(var(--u)*0);box-shadow:0 0 0 2px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}

#hud{position:absolute;inset:0;pointer-events:none}
#pz{pointer-events:auto;position:absolute;left:calc(var(--u)*12);top:calc(var(--u)*12);width:calc(var(--u)*44);height:calc(var(--u)*44);border-radius:calc(var(--u)*12);border:calc(var(--u)*3) solid #ffd23f;background:linear-gradient(#2a3a8a,#101a52);box-shadow:0 calc(var(--u)*4) 0 rgba(0,0,0,.35),inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*6);cursor:pointer;padding:0}
#pz i{display:block;width:calc(var(--u)*6);height:calc(var(--u)*18);background:#fff;border-radius:calc(var(--u)*2);box-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.4)}
#pz:focus-visible{outline:2px solid var(--gold)}
.sb{position:absolute;right:calc(var(--u)*12);top:calc(var(--u)*12);min-width:calc(var(--u)*78);background:linear-gradient(#2a3a8a,#101a52);border:calc(var(--u)*3) solid #ffd23f;box-shadow:0 calc(var(--u)*4) 0 rgba(0,0,0,.35),inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.25);border-radius:calc(var(--u)*12);padding:calc(var(--u)*4) calc(var(--u)*10);text-align:center}
.sb small{display:block;font-family:var(--disp);font-size:calc(var(--u)*11);letter-spacing:.12em;color:#c9d3ff}
.sb b{display:block;font-family:var(--disp);font-weight:400;font-size:calc(var(--u)*26);line-height:1;font-variant-numeric:tabular-nums;color:#ffe066;text-shadow:0 calc(var(--u)*2) 0 #7a3a00;transition:transform .12s ease-out}
#info{position:absolute;left:calc(var(--u)*64);right:calc(var(--u)*100);top:calc(var(--u)*22);text-align:center;font-family:var(--disp);font-size:calc(var(--u)*17);color:#fff;text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.5),0 0 calc(var(--u)*6) rgba(0,0,0,.4);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,9,32,.5)}

.pn{width:calc(var(--u)*290);background:linear-gradient(#18287a,#0b1544);border:calc(var(--u)*3) solid rgba(255,255,255,.16);border-radius:calc(var(--u)*24);padding:calc(var(--u)*22) calc(var(--u)*20);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*12);text-align:center;box-shadow:0 calc(var(--u)*10) 0 rgba(0,0,0,.3)}
.pn.menu{background:none;border:0;box-shadow:none;width:calc(var(--u)*320);gap:calc(var(--u)*14)}
.logo{font-family:var(--disp);font-size:calc(var(--u)*58);line-height:.88;color:var(--lc);--sw:calc(var(--u)*10);--sc:var(--ls);--ts:0 calc(var(--u)*7) 0 rgba(0,0,0,.38);transform:rotate(-3deg);text-transform:uppercase;text-wrap:balance;margin-bottom:calc(var(--u)*6)}
.desc{margin:0;font-weight:800;font-size:calc(var(--u)*14);line-height:1.35;color:#fff;text-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(0,0,0,.7);max-width:28ch}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*6);justify-content:center}
.chips span{background:rgba(8,14,46,.78);border:calc(var(--u)*1.5) solid rgba(255,255,255,.18);border-radius:calc(var(--u)*10);padding:calc(var(--u)*5) calc(var(--u)*9);font-size:calc(var(--u)*12);font-weight:800}
.chips b{color:var(--gold);font-variant-numeric:tabular-nums}
.pn h2{margin:0;font-family:var(--disp);font-weight:400;font-size:calc(var(--u)*40);line-height:1;color:var(--lc,#fff);--sw:calc(var(--u)*7);--sc:var(--ls,#1a1a5a);--ts:0 calc(var(--u)*4) 0 rgba(0,0,0,.35);letter-spacing:.02em}
.lbl{font-family:var(--disp);font-size:calc(var(--u)*13);letter-spacing:.14em;color:#c3ccff;margin-top:calc(var(--u)*2)}
.big{font-family:var(--disp);font-size:calc(var(--u)*44);line-height:1;font-variant-numeric:tabular-nums;margin-top:calc(var(--u)*-8)}
.mid{font-family:var(--disp);font-size:calc(var(--u)*28);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:calc(var(--u)*-8)}
.rec{font-family:var(--disp);font-size:calc(var(--u)*16);background:linear-gradient(#ffe066,#ffb703);color:#5a2a00;border-radius:calc(var(--u)*10);padding:calc(var(--u)*4) calc(var(--u)*12);letter-spacing:.06em;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.btn{font-family:var(--disp);font-size:calc(var(--u)*22);letter-spacing:.05em;color:#fff;border:0;cursor:pointer;width:calc(var(--u)*210);padding:calc(var(--u)*10) 0 calc(var(--u)*9);border-radius:calc(var(--u)*14);background:linear-gradient(#6ee67a,#22a83a);box-shadow:0 calc(var(--u)*5) 0 #136b25,inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.45);text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(calc(var(--u)*3));box-shadow:0 calc(var(--u)*2) 0 #136b25}
.btn.blue{background:linear-gradient(#4fc3ff,#1f7ae0);box-shadow:0 calc(var(--u)*5) 0 #0f4a96,inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.45)}
.btn.red{background:linear-gradient(#ff7a8a,#e0314a);box-shadow:0 calc(var(--u)*5) 0 #8a1a2a,inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.45)}
.btn.purple{background:linear-gradient(#b48cff,#7a3fe0);box-shadow:0 calc(var(--u)*5) 0 #45208a,inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.45)}
.btn.gold{background:linear-gradient(#ffe36b,#f2a900);color:#4a2400;text-shadow:0 calc(var(--u)*1) 0 rgba(255,255,255,.5);box-shadow:0 calc(var(--u)*5) 0 #8a5a00,inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.6);font-size:calc(var(--u)*17)}
.btn:disabled{filter:grayscale(.8) brightness(.8);cursor:default}
.adbox{width:100%;border-radius:calc(var(--u)*16);background:linear-gradient(160deg,var(--a),var(--b));padding:calc(var(--u)*16) calc(var(--u)*12);display:flex;flex-direction:column;gap:calc(var(--u)*8);align-items:center;box-shadow:inset 0 0 0 calc(var(--u)*2) rgba(255,255,255,.25)}
.adbox p{margin:0;font-weight:800;font-size:calc(var(--u)*13);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.adbox span{font-family:var(--disp);font-size:calc(var(--u)*14);background:rgba(6,10,36,.7);border-radius:calc(var(--u)*10);padding:calc(var(--u)*4) calc(var(--u)*10)}
.logo.sm{font-size:calc(var(--u)*34);--sw:calc(var(--u)*7)}
.btn:focus-visible{outline:calc(var(--u)*3) solid var(--gold);outline-offset:calc(var(--u)*3)}
.hint{font-size:calc(var(--u)*12);color:var(--mut);font-weight:700;margin:0}
.logo,.pn h2{position:relative}
.lg,.logo,.pn h2{z-index:0}
.lg::before,.logo::before,.pn h2::before{content:attr(data-t);position:absolute;left:0;top:0;right:0;z-index:-1;color:var(--sc);-webkit-text-stroke:var(--sw) var(--sc);text-shadow:var(--ts);pointer-events:none}
a.card{color:inherit;text-decoration:none}
html,body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#play,#play *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media (prefers-reduced-motion:reduce){.rec{animation:none}.card{transition:none}}
</style>

<div id="hub" hidden></div>
<div id="play" hidden>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <button id="pz" aria-label="Duraklat"><i></i><i></i></button>
      <div id="info"></div>
      <div class="sb"><small>SCORE</small><b id="sc">0</b></div>
    </div>
    <div id="ov"></div>
  </div>
</div>

<script>window.ARC_MODE='game'</script>
<script>
'use strict';
const W=360,H=640,TAU=Math.PI*2,OUT='#1d1530';
const R=(a,b)=>a+Math.random()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1)), CL=(v,a,b)=>v<a?a:v>b?b:v, pick=a=>a[Math.floor(Math.random()*a.length)], lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- drawing helpers ---------- */
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=p<0?0:255,t=Math.abs(p);r=Math.round(r+(f-r)*t);g=Math.round(g+(f-g)*t);b=Math.round(b+(f-b)*t);return 'rgb('+r+','+g+','+b+')'}
function lgr(c,x0,y0,x1,y1,...cols){const g=c.createLinearGradient(x0,y0,x1,y1);cols.forEach((k,i)=>g.addColorStop(i/(cols.length-1),k));return g}
function vg(c,y0,y1,...cols){return lgr(c,0,y0,0,y1,...cols)}
function rgr(c,x,y,r,a,b){const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,TAU)}
function ell(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU)}
function fs(c,fill,lw=2.5,st=OUT){c.fillStyle=fill;c.fill();if(lw){c.lineWidth=lw;c.strokeStyle=st;c.lineJoin='round';c.lineCap='round';c.stroke()}}
function shine(c,x,y,rx,ry,rot=-.5,a=.55){ell(c,x,y,rx,ry,rot);c.fillStyle='rgba(255,255,255,'+a+')';c.fill()}
function gbox(c,x,y,w,h,r,col,lw=2.5,st=OUT){rr(c,x,y,w,h,r);fs(c,vg(c,y,y+h,shade(col,.28),col,shade(col,-.22)),lw,st);c.save();rr(c,x,y,w,h,r);c.clip();c.fillStyle='rgba(255,255,255,.22)';c.fillRect(x+3,y+2,w-6,Math.min(5,h*.25));c.restore()}
function box(c,x,y,w,h,r,col,hl=.24){rr(c,x,y,w,h,r);c.fillStyle=col;c.fill();c.save();c.clip();c.fillStyle='rgba(255,255,255,'+hl+')';c.fillRect(x,y,w,h*.42);c.fillStyle='rgba(0,0,0,.18)';c.fillRect(x,y+h*.78,w,h*.22);c.restore()}
function orb(c,x,y,r,col,lw=0){circ(c,x,y,r);const gr=c.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);gr.addColorStop(0,shade(col,.6));gr.addColorStop(.35,col);gr.addColorStop(1,shade(col,-.45));fs(c,gr,lw)}
function eye(c,x,y,r,lx=0,ly=0,lw=1.6){circ(c,x,y,r);fs(c,'#fff',lw);circ(c,x+lx*r*.35,y+ly*r*.35,r*.56);c.fillStyle=OUT;c.fill();circ(c,x+lx*r*.35-r*.2,y+ly*r*.35-r*.22,r*.2);c.fillStyle='#fff';c.fill()}
function blush(c,x,y,r){ell(c,x,y,r,r*.6);c.fillStyle='rgba(255,110,140,.45)';c.fill()}
function emo(c,ch,x,y,s){c.font=s+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(ch,x,y)}
function shadow(c,x,y,rx,ry,a=.22){ell(c,x,y,rx,ry);c.fillStyle='rgba(0,0,0,'+a+')';c.fill()}
function coin(c,x,y,r=10,t=0){const sx=Math.abs(Math.cos(t*3))*.6+.4;c.save();c.translate(x,y);c.scale(sx,1);circ(c,0,0,r);fs(c,rgr(c,0,0,r,'#fff3a0','#f2a900'),2,'#8a5a00');circ(c,0,0,r*.58);c.lineWidth=2;c.strokeStyle='#c98a00';c.stroke();shine(c,-r*.3,-r*.35,r*.3,r*.16,-.6,.8);c.restore()}
function star5(c,x,y,r,col,lw=0){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath();fs(c,col,lw)}
function segDist(ax,ay,bx,by,px,py){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;const t=l?CL(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function circRect(cx,cy,r,x,y,w,h){return Math.hypot(cx-CL(cx,x,x+w),cy-CL(cy,y,y+h))<r}
function hearts(n){return '♥'.repeat(Math.max(0,n))}
function clouds(c,x,y,s,a=.9){c.fillStyle='rgba(255,255,255,'+a+')';c.beginPath();c.arc(x,y,18*s,0,TAU);c.arc(x+20*s,y-8*s,22*s,0,TAU);c.arc(x+44*s,y,18*s,0,TAU);c.rect(x,y,44*s,16*s);c.fill()}
function txt(c,s,x,y,size,col,st='rgba(10,14,40,.9)',lw){c.font=size+'px "Lilita One","Arial Black",sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=lw||Math.max(3,size*.22);c.strokeStyle=st;c.strokeText(s,x,y);c.fillStyle=col;c.fillText(s,x,y)}

function cTree(c,x,y,s,col='#3fa34d'){c.save();c.translate(x,y);c.scale(s,s);shadow(c,0,4,18,5,.25);rr(c,-5,-20,10,24,3);fs(c,'#8a5a2a',2.2);circ(c,0,-34,20);fs(c,rgr(c,0,-34,20,shade(col,.35),col),2.5);circ(c,-12,-26,12);fs(c,rgr(c,-12,-26,12,shade(col,.3),col),2.4);circ(c,12,-25,12);fs(c,rgr(c,12,-25,12,shade(col,.3),col),2.4);shine(c,-6,-44,6,3,-.5,.4);c.restore()}
function flower(c,x,y,col){for(let k=0;k<5;k++){const a=k*TAU/5;circ(c,x+Math.cos(a)*3.5,y+Math.sin(a)*3.5,2.8);fs(c,col,1,'rgba(0,0,0,.35)')}circ(c,x,y,2.2);fs(c,'#ffd23f',0)}
/* ---------- shared characters ---------- */
// astronaut, feet at (0,0) local
function astroSpr(c,x,y,face,s,leg,sq,jet){c.save();c.translate(x,y);c.scale(face*s*(1+sq),s*(1-sq));
  if(jet>0){const f=8+Math.random()*10*jet;c.beginPath();c.moveTo(-20,-22);c.quadraticCurveTo(-14,-22+f*1.4,-8,-22);fs(c,lgr(c,0,-22,0,-22+f*1.4,'#fff6b0','#ff7b1f'),0)}
  rr(c,-21,-46,12,26,5);fs(c,lgr(c,0,-46,0,-20,'#d4dbec','#9aa6c4'),2.2);
  const a=Math.sin(leg)*4;
  rr(c,-12,-18+a,10,16,4);fs(c,'#e9edf7',2.2);rr(c,2,-18-a,10,16,4);fs(c,'#e9edf7',2.2);
  rr(c,-13,-5+a,12,6,3);fs(c,'#5a6788',2);rr(c,1,-5-a,12,6,3);fs(c,'#5a6788',2);

  if(g.banner){const b=g.banner,k=b.t>1.5?(1.8-b.t)/.3:b.t<.4?b.t/.4:1,sc=b.t>1.5?.6+.4*k:1;c.save();c.globalAlpha=CL(k,0,1);c.translate(W/2,200);c.scale(sc,sc);rr(c,-120,-42,240,84,20);fs(c,'rgba(10,16,52,.82)',3,'rgba(255,255,255,.3)');txt(c,'SEVİYE '+b.n,0,-10,36,cur.th[2],cur.th[3],9);txt(c,'HIZLANIYOR!',0,24,16,'#fff','rgba(10,14,40,.9)',5);c.restore()}}
function drawJoy(g,c){if(!cur.joy||!g.ptr.down||phase!=='play')return;const p=g.ptr,jx=p.x-p.sx,jy=p.y-p.sy,d=Math.hypot(jx,jy),k=d>55?55/d:1;c.save();c.globalAlpha=.55;circ(c,p.sx,p.sy,55);fs(c,'rgba(255,255,255,.12)',3,'rgba(255,255,255,.6)');circ(c,p.sx+jx*k,p.sy+jy*k,22);fs(c,'rgba(255,255,255,.75)',2.5,'rgba(10,14,40,.5)');c.restore()}

  drive:{k:'x...x...x...x...',s:'....x.......x...',h:'..x...x...x...x.',b:'x.xxx.xxx.xxx.x.',ar:1,oct:1,blen:.9},
  chip:{k:'x.......x.......',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.',b:'x...x.x.x...x.x.',ar:1,blen:1.2},
  dark:{k:'x.........x.....',s:'............x...',h:'....x.......x...',b:'x.......x.......',ar:2,blen:6},
  synth:{k:'x...x...x...x...',s:'....x.......x..x',h:'.x.x.x.x.x.x.x.x',b:'xxxxxxxxxxxxxxxx',ar:1,blen:.8},
  bounce:{k:'x..x..x.x..x..x.',s:'....x.......x...',h:'..x...x...x...x.',b:'x..x..x.x..x..x.',ar:2,blen:1.4},
  taiko:{k:'x..x....x.x.....',s:'....x..x....x...',h:'x.x.x.x.x.x.x.x.',b:'x..x....x.x.....',ar:1,blen:1.4}};
const MTH={
  burger:{bpm:124,root:50,sc:'dor',prog:[0,3,4,3],st:'bounce',bw:'square',aw:'square'},
  space:{bpm:118,root:52,sc:'phr',prog:[0,1,0,6],st:'synth',aw:'sawtooth'},
  bottle:{bpm:96,root:57,sc:'minor',prog:[0,5,2,6],st:'dark',aw:'triangle'},
  fruit:{bpm:132,root:55,sc:'harm',prog:[0,3,4,0],st:'drive',aw:'square'},
  chicken:{bpm:140,root:55,sc:'minor',prog:[0,5,6,4],st:'chip'},
  ninja:{bpm:146,root:52,sc:'miy',prog:[0,1,3,0],st:'taiko',aw:'triangle'},
  block:{bpm:110,root:48,sc:'dor',prog:[0,3,5,4],st:'chip',aw:'triangle'},
  fish:{bpm:100,root:50,sc:'minor',prog:[0,5,3,4],st:'dark',aw:'sine'},
  car:{bpm:156,root:52,sc:'minor',prog:[0,5,6,4],st:'drive'},
  magnet:{bpm:136,root:54,sc:'phr',prog:[0,1,6,1],st:'synth'},
  rooftop:{bpm:138,root:47,sc:'minor',prog:[0,5,2,6],st:'drive',aw:'triangle'},
  potion:{bpm:112,root:50,sc:'harm',prog:[0,3,4,1],st:'bounce',aw:'triangle'},
  titan:{bpm:122,root:48,sc:'minor',prog:[0,5,2,4],st:'chip'},
  shadow:{bpm:144,root:51,sc:'phr',prog:[0,1,0,4],st:'synth'},
  jelly:{bpm:118,root:53,sc:'minor',prog:[0,3,5,4],st:'bounce',aw:'square'},
  orbit:{bpm:104,root:52,sc:'phr',prog:[0,1,5,6],st:'dark',aw:'sawtooth',drone:1},
  robo:{bpm:128,root:48,sc:'minor',prog:[0,6,5,6],st:'chip'},
  cloud:{bpm:108,root:57,sc:'dor',prog:[0,3,0,4],st:'bounce',aw:'triangle'},
  lantern:{bpm:84,root:50,sc:'phr',prog:[0,1,0,1],st:'dark',aw:'triangle',drone:1}};
const MUS={on:true,out:null,filt:null,timer:null,step:0,next:0,th:null,lvl:1,danger:false,playing:false,nz:null};
try{MUS.on=localStorage.getItem('arc_mus')!=='0'}catch(e){}
function musInit(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(MUS.out)return;
  MUS.out=AC.createGain();MUS.out.gain.value=0;MUS.filt=AC.createBiquadFilter();MUS.filt.type='lowpass';MUS.filt.frequency.value=4000;const comp=AC.createDynamicsCompressor();MUS.out.connect(MUS.filt).connect(comp).connect(AC.destination);
  const n=Math.floor(AC.sampleRate*.5),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;MUS.nz=b}
function mfreq(m){return 440*Math.pow(2,(m-69)/12)}
function mnote(m,t,d,w,v,cut){const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.value=mfreq(m);let n=o;if(cut){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;o.connect(f);n=f}n.connect(g);g.connect(MUS.out);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.05,d));o.start(t);o.stop(t+d+.05)}
function mkick(t,v,f0=150){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g).connect(MUS.out);o.start(t);o.stop(t+.3)}
function mnz(t,v,hp,d){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=MUS.nz;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(MUS.out);s.start(t,Math.random()*.3);s.stop(t+d+.02)}
function musStep(i,t,sp){const th=MUS.th,st=STY[th.st],lv=MUS.lvl,sc=SCL[th.sc],s=i%16,bar=Math.floor(i/16)%th.prog.length,deg=th.prog[bar];
  const N=d=>th.root+sc[((d%sc.length)+sc.length)%sc.length]+12*Math.floor(d/sc.length);
  if(st.k[s]==='x')mkick(t,.85);
  if(lv>=2&&st.s[s]==='x'){mnz(t,.28,1200,.16);mnote(190,t,.08,'triangle',.06)}
  if((lv>=2&&st.h[s]==='x')||(lv>=5&&s%2===1))mnz(t,lv>=5?.09:.06,7000,.045);
  if(st.b[s]==='x')mnote(N(deg)-24+(st.oct&&s%2?12:0),t,sp*st.blen,th.bw||'sawtooth',.13,500+lv*180);
  if(s===0)for(const k of[0,2,4])mnote(N(deg+k),t,sp*16,'triangle',.028,1600);
  if(lv>=3&&s%st.ar===0){const ch=[0,2,4,7];mnote(N(deg+ch[Math.floor(i/st.ar)%4])+12,t,sp*.9,th.aw||'square',.04,2600+lv*350)}
  if(lv>=5&&(s===6||s===14))mnote(N(deg+(s===6?4:5))+24,t,sp*3,'sawtooth',.026,4200);
  if(th.drone&&s===0&&bar%2===0)mnote(th.root-24,t,sp*32,'sine',.09,500);
  if(MUS.danger&&(s===0||s===3||s===8||s===11)){mkick(t,s%8===0?.7:.45,70);if(s===0)mnote(N(deg)+25,t,sp*8,'sine',.03,3000)}}
function musTick(){if(!MUS.playing||!AC)return;const lv=MUS.lvl,sp=60/(MUS.th.bpm*(1+Math.min(.32,(lv-2)*.04)))/4;
  while(MUS.next<AC.currentTime+.14){musStep(MUS.step,MUS.next,sp);MUS.next+=sp;MUS.step++}
  MUS.filt.frequency.setTargetAtTime(Math.min(16000,2200+lv*1800),AC.currentTime,.6)}
function musPlay(id){if(!MUS.on||!sound)return;try{musInit();MUS.th=MTH[id]||MTH.chicken;const t=AC.currentTime;if(!MUS.playing){MUS.step=0;MUS.next=t+.06}MUS.playing=true;MUS.out.gain.cancelScheduledValues(t);MUS.out.gain.setValueAtTime(MUS.out.gain.value,t);MUS.out.gain.linearRampToValueAtTime(.3,t+.5);clearInterval(MUS.timer);MUS.timer=setInterval(musTick,25);musTick()}catch(e){}}
function musStop(f=.35){MUS.playing=false;clearInterval(MUS.timer);MUS.timer=null;if(!MUS.out||!AC)return;const t=AC.currentTime;MUS.out.gain.cancelScheduledValues(t);MUS.out.gain.setValueAtTime(MUS.out.gain.value,t);MUS.out.gain.linearRampToValueAtTime(0,t+f)}
setInterval(()=>{if(G&&MUS.playing){MUS.lvl=G.tn+1;MUS.danger=!!G.danger&&!G.dead}},200);

if(MODE==='game')openGame(0);
</script>
