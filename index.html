<style>html,body{margin:0;height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: arcade lobby grid of game cabinets; each game opens in a portrait 9:16 stage with menu / pause / game-over overlays */
:root{
  --ink:#0a1033; --deep:#060a24; --panel:#14215f; --panel2:#0c1645;

  --disp:'Lilita One','Arial Black',Impact,sans-serif;

.brand span{color:#5fe3ff}
.sub{color:var(--mut);font-weight:800;margin:10px 0 0;max-width:46ch}
.tot{font-family:var(--disp);font-size:18px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 14px;letter-spacing:.04em}

.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;display:block}
.th .lg{position:absolute;left:10px;bottom:10px;right:10px;font-family:var(--disp);font-size:clamp(22px,6vw,30px);line-height:.9;color:var(--lc);--sw:7px;--sc:var(--ls);--ts:0 4px 0 rgba(0,0,0,.35);text-transform:uppercase;transform:rotate(-3deg);transform-origin:left bottom}

.sb b{display:block;font-family:var(--disp);font-weight:400;font-size:calc(var(--u)*26);line-height:1;font-variant-numeric:tabular-nums;color:#ffe066;text-shadow:0 calc(var(--u)*2) 0 #7a3a00;transition:transform .12s ease-out}

.btn{font-family:var(--disp);font-size:calc(var(--u)*22);letter-spacing:.05em;color:#fff;border:0;cursor:pointer;width:calc(var(--u)*210);padding:calc(var(--u)*10) 0 calc(var(--u)*9);border-radius:calc(var(--u)*14);background:linear-gradient(#6ee67a,#22a83a);box-shadow:0 calc(var(--u)*5) 0 #136b25,inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.45);text-shadow:0 calc(var(--u)*2) 0 rgba(0,0,0,.3);transition:transform .08s}

.adbox{width:100%;border-radius:calc(var(--u)*16);background:linear-gradient(160deg,var(--a),var(--b));padding:calc(var(--u)*16) calc(var(--u)*12);display:flex;flex-direction:column;gap:calc(var(--u)*8);align-items:center;box-shadow:inset 0 0 0 calc(var(--u)*2) rgba(255,255,255,.25)}

.adbox span{font-family:var(--disp);font-size:calc(var(--u)*14);background:rgba(6,10,36,.7);border-radius:calc(var(--u)*10);padding:calc(var(--u)*4) calc(var(--u)*10)}
.logo.sm{font-size:calc(var(--u)*34);--sw:calc(var(--u)*7)}
.btn:focus-visible{outline:calc(var(--u)*3) solid var(--gold);outline-offset:calc(var(--u)*3)}

.logo,.pn h2{position:relative}
.lg,.logo,.pn h2{z-index:0}

#play,#play *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

</style>

onus!", ["#5ccf45", "#1f6a2a", "#ffd23f", "#0f3a10"]], ["mole", "Whack-a-Mole", "Köstebekler çıkınca hızlıca vur! Altın köstebek +3, bombaya sakın dokunma.", ["#7bd34f", "#8a5a3a", "#ffd23f", "#3a2010"]], ["flappy", "Flappy Wings", "Kanat çırp, borulara çarpmadan uç. Aralıklar daralır, ileride borular hareket eder!", ["#4dd0ff", "#1f7ae0", "#ffd23f", "#0b3a6a"]], ["brick", "Brick Breaker", "Topu sektir, tuğlaları kır. Her bölümde top hızlanır, sert tuğlalar artar. Düşen güçleri topla!", ["#ff3df2", "#3a0ca3", "#5ff0ff", "#14002e"]], ["meteor", "Meteor Dodge", "Gökten yağan meteorlardan kaç! Kırmızı işaret nereye düşeceğini gösterir. Kalkan topla.", ["#ff7b1f", "#5a1a7a", "#ffd23f", "#2a0a3a"]]]</script>
<script>

window.addEventListener('keyup',e=>{if(!cur||!G)return;const k=e.key;if((k==='ArrowLeft'||k==='a')&&G.ax<0)G.ax=0;if((k==='ArrowRight'||k==='d')&&G.ax>0)G.ax=0;if((k==='ArrowUp'||k==='w')&&G.ay<0)G.ay=0;if((k==='ArrowDown'||k==='s')&&G.ay>0)G.ay=0;
  if(held[k]){const p=held[k];delete held[k];if(phase==='play'&&!G.dead&&cur.up)cur.up(G,p[0],p[1])}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='play')showPause()});

/* ---------- hub ---------- */
function refreshHub(){if(!grid)return;let tot=0;GAMES.forEach(gm=>{const v=getHS(gm.id);tot+=v;const el=document.getElementById('hs-'+gm.id);if(el)el.textContent=v});const te=$('#tot');if(te)te.textContent=tot}
if(grid)GAMES.forEach((gm,i)=>{const[a,b,lc,ls]=gm.th,el=document.createElement(MODE==='hub'?'a':'button');if(MODE==='hub')el.href='games/'+gm.id+'.html';el.className='card';el.style.cssText='--a:'+a+';--b:'+b+';--lc:'+lc+';--ls:'+ls;el.setAttribute('aria-label',gm.name+' oyununu aç');
  el.innerHTML='<div class="ch"><h3>'+(i+1)+'. '+gm.name+'</h3><p>'+gm.desc+'</p></div><div class="th"><img alt="" id="im-'+gm.id+'"><span class="no">'+(i+1)+'</span><span class="best">REKOR <b id="hs-'+gm.id+'">0</b></span><div class="lg" data-t="'+gm.name+'">'+gm.name+'</div></div>';
  if(MODE!=='hub')el.addEventListener('click',()=>openGame(i));grid.appendChild(el)});
refreshHub();
function thumb(gm){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),g=mkG(true);try{gm.init(g);for(let i=0;i<70;i++){g.t+=1/60;if(!g.dead)gm.update(g,1/60)}gm.draw(g,x)}catch(e){console.error(gm.id,e)}return c.toDataURL('image/jpeg',.82)}
function thumbs(){GAMES.forEach((gm,i)=>setTimeout(()=>{const im=document.getElementById('im-'+gm.id);if(im)im.src=thumb(gm)},40+i*25))}
if(grid)(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(thumbs);
window.addEventListener('pageshow',e=>{if(e.persisted)refreshHub()});
/* ---------- procedural tension music ---------- */
const SCL={minor:[0,2,3,5,7,8,10],phr:[0,1,3,5,7,8,10],harm:[0,2,3,5,7,8,11],dor:[0,2,3,5,7,9,10],miy:[0,1,5,7,8]};
const STY={
  drive:{k:'x...x...x...x...',s:'....x.......x...',h:'..x...x...x...x.',b:'x.xxx.xxx.xxx.x.',ar:1,oct:1,blen:.9},
  chip:{k:'x.......x.......',s:'....x.......x...',h:'x.x.x.x.x.x.x.x.',b:'x...x.x.x...x.x.',ar:1,blen:1.2},
  dark:{k:'x.........x.....',s:'............x...',h:'....x.......x...',b:'x.......x.......',ar:2,blen:6},
  synth:{k:'x...x...x...x...',s:'....x.......x..x',h:'.x.x.x.x.x.x.x.x',b:'xxxxxxxxxxxxxxxx',ar:1,blen:.8},
  bounce:{k:'x..x..x.x..x..x.',s:'....x.......x...',h:'..x...x...x...x.',b:'x..x..x.x..x..x.',ar:2,blen:1.4},
  taiko:{k:'x..x....x.x.....',s:'....x..x....x...',h:'x.x.x.x.x.x.x.x.',b:'x..x....x.x.....',ar:1,blen:1.4}};
const MTH={
  burger:{bpm:124,root:50,sc:'dor',prog:[0,3,4,3],st:'bounce',bw:'square',aw:'square'},
  space:{bpm:118,root:52,sc:'phr',prog:[0,1,0,6],st:'synth',aw:'sawtooth'},
  bottle:{bpm:96,root:57,sc:'minor',prog:[0,5,2,6],st:'dark',aw:'triangle'},
  fruit:{bpm:132,root:55,sc:'harm',prog:[0,3,4,0],st:'drive',aw:'square'},
  chicken:{bpm:140,root:55,sc:'minor',prog:[0,5,6,4],st:'chip'},
  ninja:{bpm:146,root:52,sc:'miy',prog:[0,1,3,0],st:'taiko',aw:'triangle'},
  block:{bpm:110,root:48,sc:'dor',prog:[0,3,5,4],st:'chip',aw:'triangle'},
  fish:{bpm:100,root:50,sc:'minor',prog:[0,5,3,4],st:'dark',aw:'sine'},
  car:{bpm:156,root:52,sc:'minor',prog:[0,5,6,4],st:'drive'},
  magnet:{bpm:136,root:54,sc:'phr',prog:[0,1,6,1],st:'synth'},
  rooftop:{bpm:138,root:47,sc:'minor',prog:[0,5,2,6],st:'drive',aw:'triangle'},
  potion:{bpm:112,root:50,sc:'harm',prog:[0,3,4,1],st:'bounce',aw:'triangle'},
  titan:{bpm:122,root:48,sc:'minor',prog:[0,5,2,4],st:'chip'},
  shadow:{bpm:144,root:51,sc:'phr',prog:[0,1,0,4],st:'synth'},
  jelly:{bpm:118,root:53,sc:'minor',prog:[0,3,5,4],st:'bounce',aw:'square'},
  orbit:{bpm:104,root:52,sc:'phr',prog:[0,1,5,6],st:'dark',aw:'sawtooth',drone:1},
  robo:{bpm:128,root:48,sc:'minor',prog:[0,6,5,6],st:'chip'},
  cloud:{bpm:108,root:57,sc:'dor',prog:[0,3,0,4],st:'bounce',aw:'triangle'},
  arrow:{bpm:112,root:50,sc:'dor',prog:[0,3,4,0],st:'taiko',aw:'triangle'},
  balance:{bpm:104,root:53,sc:'harm',prog:[0,5,4,0],st:'bounce',aw:'square'},
  hoop:{bpm:124,root:52,sc:'minor',prog:[0,5,6,4],st:'drive',aw:'square'},
  knife:{bpm:134,root:50,sc:'phr',prog:[0,1,0,6],st:'taiko'},
  color:{bpm:128,root:55,sc:'minor',prog:[0,5,3,4],st:'synth'},
  snake:{bpm:120,root:48,sc:'harm',prog:[0,3,4,0],st:'chip'},
  mole:{bpm:130,root:55,sc:'dor',prog:[0,3,0,4],st:'bounce',aw:'square'},
  flappy:{bpm:116,root:57,sc:'minor',prog:[0,5,6,4],st:'chip',aw:'triangle'},
  brick:{bpm:138,root:52,sc:'phr',prog:[0,1,5,6],st:'synth'},
  meteor:{bpm:148,root:50,sc:'phr',prog:[0,1,0,4],st:'drive',drone:1},
  lantern:{bpm:84,root:50,sc:'phr',prog:[0,1,0,1],st:'dark',aw:'triangle',drone:1}};
const MUS={on:true,out:null,filt:null,timer:null,step:0,next:0,th:null,lvl:1,danger:false,playing:false,nz:null};
try{MUS.on=localStorage.getItem('arc_mus')!=='0'}catch(e){}
function musInit(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(MUS.out)return;
  MUS.out=AC.createGain();MUS.out.gain.value=0;MUS.filt=AC.createBiquadFilter();MUS.filt.type='lowpass';MUS.filt.frequency.value=4000;const comp=AC.createDynamicsCompressor();MUS.out.connect(MUS.filt).connect(comp).connect(AC.destination);
  const n=Math.floor(AC.sampleRate*.5),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;MUS.nz=b}
function mfreq(m){return 440*Math.pow(2,(m-69)/12)}
function mnote(m,t,d,w,v,cut){const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.value=mfreq(m);let n=o;if(cut){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;o.connect(f);n=f}n.connect(g);g.connect(MUS.out);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.05,d));o.start(t);o.stop(t+d+.05)}
function mkick(t,v,f0=150){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g).connect(MUS.out);o.start(t);o.stop(t+.3)}
function mnz(t,v,hp,d){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=MUS.nz;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(MUS.out);s.start(t,Math.random()*.3);s.stop(t+d+.02)}
function musStep(i,t,sp){const th=MUS.th,st=STY[th.st],lv=MUS.lvl,sc=SCL[th.sc],s=i%16,bar=Math.floor(i/16)%th.prog.length,deg=th.prog[bar];
  const N=d=>th.root+sc[((d%sc.length)+sc.length)%sc.length]+12*Math.floor(d/sc.length);
  if(st.k[s]==='x')mkick(t,.85);
  if(lv>=2&&st.s[s]==='x'){mnz(t,.28,1200,.16);mnote(190,t,.08,'triangle',.06)}
  if((lv>=2&&st.h[s]==='x')||(lv>=5&&s%2===1))mnz(t,lv>=5?.09:.06,7000,.045);
  if(st.b[s]==='x')mnote(N(deg)-24+(st.oct&&s%2?12:0),t,sp*st.blen,th.bw||'sawtooth',.13,500+lv*180);
  if(s===0)for(const k of[0,2,4])mnote(N(deg+k),t,sp*16,'triangle',.028,1600);
  if(lv>=3&&s%st.ar===0){const ch=[0,2,4,7];mnote(N(deg+ch[Math.floor(i/st.ar)%4])+12,t,sp*.9,th.aw||'square',.04,2600+lv*350)}
  if(lv>=5&&(s===6||s===14))mnote(N(deg+(s===6?4:5))+24,t,sp*3,'sawtooth',.026,4200);
  if(th.drone&&s===0&&bar%2===0)mnote(th.root-24,t,sp*32,'sine',.09,500);
  if(MUS.danger&&(s===0||s===3||s===8||s===11)){mkick(t,s%8===0?.7:.45,70);if(s===0)mnote(N(deg)+25,t,sp*8,'sine',.03,3000)}}
function musTick(){if(!MUS.playing||!AC)return;const lv=MUS.lvl,sp=60/(MUS.th.bpm*(1+Math.min(.32,(lv-2)*.04)))/4;
  while(MUS.next<AC.currentTime+.14){musStep(MUS.step,MUS.next,sp);MUS.next+=sp;MUS.step++}
  MUS.filt.frequency.setTargetAtTime(Math.min(16000,2200+lv*1800),AC.currentTime,.6)}
function musPlay(id){if(!MUS.on||!sound)return;try{musInit();MUS.th=MTH[id]||MTH.chicken;const t=AC.currentTime;if(!MUS.playing){MUS.step=0;MUS.next=t+.06}MUS.playing=true;MUS.out.gain.cancelScheduledValues(t);MUS.out.gain.setValueAtTime(MUS.out.gain.value,t);MUS.out.gain.linearRampToValueAtTime(.3,t+.5);clearInterval(MUS.timer);MUS.timer=setInterval(musTick,25);musTick()}catch(e){}}
function musStop(f=.35){MUS.playing=false;clearInterval(MUS.timer);MUS.timer=null;if(!MUS.out||!AC)return;const t=AC.currentTime;MUS.out.gain.cancelScheduledValues(t);MUS.out.gain.setValueAtTime(MUS.out.gain.value,t);MUS.out.gain.linearRampToValueAtTime(0,t+f)}
setInterval(()=>{if(G&&MUS.playing){MUS.lvl=G.tn+1;MUS.danger=!!G.danger&&!G.dead}},200);

if(MODE==='game')openGame(0);
